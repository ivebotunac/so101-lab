# Facts about the lab's arm that every guide and script reads instead of repeating them.
# What differs per computer, the ports and the camera indexes, goes into robot.local.yaml
# beside this file: copy robot.local.example.yaml, fill it from lerobot-find-port and
# lerobot-find-cameras. That file is gitignored and laid over this one.

follower:
  type: so101_follower
  id: lab_follower        # calibration key, never change without recalibrating
  port: null
  voltage: 12
  rest_pose:              # degrees, read with torque off while the arm lay folded; rest() goes here
    shoulder_pan: 0
    shoulder_lift: -74
    elbow_flex: 95
    wrist_flex: 75
    wrist_roll: 0
    gripper: 2

leader:
  type: so101_leader
  id: lab_leader
  port: null
  voltage: 5

cameras:
  scene:                  # laptop camera, sees the whole workspace
    type: opencv
    index_or_path: null
    width: 640
    height: 480
    fps: 30
  wrist:                  # on the follower's gripper
    type: opencv
    index_or_path: null
    width: 640
    height: 480
    fps: 30
